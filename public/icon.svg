<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="quizGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect x="8" y="8" width="104" height="104" rx="24" fill="url(#quizGrad)"/>
  <!-- Inner card -->
  <rect x="28" y="28" width="64" height="64" rx="12" fill="#0b0f11" opacity="0.95"/>
  <!-- Question mark -->
  <text x="60" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="900" fill="url(#quizGrad)">?</text>
  <!-- Checkmark dots -->
  <circle cx="38" cy="38" r="4" fill="#0ea5e9"/>
  <circle cx="82" cy="38" r="4" fill="#22c55e"/>
  <circle cx="38" cy="82" r="4" fill="#22c55e"/>
  <circle cx="82" cy="82" r="4" fill="#0ea5e9"/>
</svg>
